# TEST: IDE optical drives share the six physical SATA ports
# QEMU_VERSION: 11.0.3
# EXPECT_ERROR: azw-me-pro-6 has only six shared SATA/IDE ports; no free port for ide2
machine: azw-me-pro-6
memory: 512
ide2: none,media=cdrom
sata0: local:8006/vm-8006-disk-0.raw,size=1G
sata1: local:8006/vm-8006-disk-1.raw,size=1G
sata2: local:8006/vm-8006-disk-2.raw,size=1G
sata3: local:8006/vm-8006-disk-3.raw,size=1G
sata4: local:8006/vm-8006-disk-4.raw,size=1G
sata5: local:8006/vm-8006-disk-5.raw,size=1G
