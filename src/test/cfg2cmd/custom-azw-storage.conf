# TEST: Fixed platform ports with UEFI, SATA, IDE, NVMe, USB storage and eMMC
# QEMU_VERSION: 11.0.3
machine: azw-me-pro-6,enable-s3=0,enable-s4=0,viommu=intel
bios: ovmf
memory: 512
ostype: l26
boot: order=nvme0;sata5;ide2;usbdisk0
ide0: none,media=cdrom
ide2: local:iso/installer.iso,media=cdrom
sata0: local:8006/vm-8006-disk-0.raw,size=1G
sata2: local:8006/vm-8006-disk-1.raw,size=1G
sata5: local:8006/vm-8006-disk-2.raw,size=1G,serial=LAB-SATA
nvme0: local:8006/vm-8006-disk-3.raw,size=1G
nvme1: local:8006/vm-8006-disk-4.raw,size=1G
nvme2: local:8006/vm-8006-disk-5.raw,size=1G,serial=LAB-NVME
usbdisk0: local:8006/vm-8006-disk-6.raw,size=1G
emmc0: local:8006/vm-8006-disk-7.raw,size=1G
net0: virtio=52:54:00:00:00:01,bridge=vmbr0
net1: e1000e=52:54:00:00:00:02,bridge=vmbr0
