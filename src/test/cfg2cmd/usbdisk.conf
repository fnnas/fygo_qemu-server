# TEST: USB storage uses separate ports from passthrough and coexists with NVMe
# QEMU_VERSION: 11.1.0
boot: order=usbdisk7;usbdisk0;usb0
memory: 512
nvme0: local:8006/vm-8006-disk-2.raw
ostype: l26
usb0: host=1234:5678
usbdisk0: local:8006/vm-8006-disk-0.raw,discard=on,iops_wr=100,mbps_rd=10
usbdisk7: local:8006/vm-8006-disk-1.qcow2,cache=writethrough,removable=0,ro=1,serial=custom%2Cserial
